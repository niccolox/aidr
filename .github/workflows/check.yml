name: check
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    strategy: {matrix: {os: [ubuntu-latest, macos-latest], node: [20, 22]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: ${{ matrix.node }}}
      - run: node --test 'test/*.test.mjs'
      - name: Only the listed files ship
        run: npm pack --dry-run --json > pack.json && node -e "const f=require('./pack.json')[0].files.map(x=>x.path).sort();const ok=f.every(p=>/^(bin|lib)\\//.test(p)||['README.md','LICENSE','package.json'].includes(p));if(!ok){console.error(f);process.exit(1)}"
      - name: No install script
        run: node -e "const s=require('./package.json').scripts||{};for(const k of ['preinstall','install','postinstall','prepare'])if(s[k])process.exit(1)"
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}}
